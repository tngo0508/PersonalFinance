name: Build, Test, and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths-ignore:
      # Docs and IDE settings don't affect the build or deployment
      - '**/*.md'
      - '.idea/**'
      - '.junie/**'
      - '.claude/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      # Docs and IDE settings don't affect the build or deployment
      - '**/*.md'
      - '.idea/**'
      - '.junie/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Azure Environment Name prefix (e.g. pf-prod)'
        required: false
        default: 'pf-prod'
        type: string
      deploy_sql:
        description: 'Provision Azure SQL Database Serverless Free Tier ($0.00)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry-run validation / What-If only (skip container push and Azure deployment)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

# One run per PR / branch. A new push to a PR cancels its in-progress run; runs on main
# queue instead of cancelling so an Azure deployment is never interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: personalfinance-api
  WEB_IMAGE_NAME: personalfinance-web
  AZURE_RESOURCE_GROUP: rg-personalfinance-prod
  AZURE_LOCATION: westus2
  AZURE_SQL_LOCATION: westus2
  ENVIRONMENT_NAME: pf-prod

jobs:
  # ============================================================================
  # 1. BUILD & AUTOMATED TEST SUITE (.NET 10)
  # ============================================================================
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet packages
        run: dotnet restore PersonalFinance.sln

      - name: Build solution (Release)
        run: dotnet build PersonalFinance.sln --configuration Release --no-restore -p:EnforceWarningsAsErrors=true

      # Reports .editorconfig formatting drift without failing the build (fix locally with `dotnet format`).
      # Make it blocking by removing continue-on-error once main is clean.
      - name: Check code formatting (non-blocking)
        continue-on-error: true
        run: dotnet format whitespace PersonalFinance.sln --verify-no-changes --no-restore --exclude PersonalFinance/src/PersonalFinance.Web/wwwroot/lib PersonalFinance/src/PersonalFinance.Data/Migrations

      - name: Execute test suite
        run: dotnet test PersonalFinance.sln --configuration Release --no-build --verbosity normal

  # ============================================================================
  # 1b. JAVASCRIPT LINT — ESLint (runs in parallel)
  # ============================================================================
  lint-js:
    name: Lint JavaScript (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint JavaScript files
        run: npm run lint

  # ============================================================================
  # 1c. E2E BROWSER TESTS — Playwright UI + API endpoint tests (runs in parallel)
  # Starts both ApiService and Web locally with InMemory DB, runs browser-based
  # E2E tests against the Web URL and curl-based tests against the API URL.
  # ============================================================================
  e2e-browser-tests:
    name: E2E Browser Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore and build solution
        run: |
          dotnet restore PersonalFinance.sln
          dotnet build PersonalFinance.sln --configuration Release --no-restore -p:EnforceWarningsAsErrors=true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install npm dependencies
        run: npm ci

      - name: Assign random ports
        id: ports
        run: |
          API_PORT=$((RANDOM % 10000 + 10000))
          WEB_PORT=$((RANDOM % 10000 + 10000))
          echo "api_port=$API_PORT" >> $GITHUB_OUTPUT
          echo "web_port=$WEB_PORT" >> $GITHUB_OUTPUT

      - name: Start ApiService with InMemory DB
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DATABASE_PROVIDER: InMemory
          ConnectionStrings__DefaultConnection: InMemory:E2ETestApi
        run: |
          echo "Starting ApiService on port ${{ steps.ports.outputs.api_port }} (logs -> .api.log)"
          dotnet run --project PersonalFinance/src/PersonalFinance.ApiService \
            --environment Development \
            --urls "http://0.0.0.0:${{ steps.ports.outputs.api_port }}" \
            > .api.log 2>&1 &
          sleep 1
          ps aux | grep -E "dotnet.*PersonalFinance.ApiService" || true
          echo "ApiService backgrounded; continuing to health check."

      - name: Wait for ApiService health
        run: |
          echo "Waiting for ApiService to start (port ${{ steps.ports.outputs.api_port }})..."
          MAX_RETRIES=50
          SLEEP_SECONDS=3
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -S --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "http://localhost:${{ steps.ports.outputs.api_port }}/health" 2>/dev/null || echo "000")
            echo "Attempt $i/$MAX_RETRIES: ApiService /health returned HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "ApiService is healthy."
              exit 0
            fi
            sleep $SLEEP_SECONDS
          done

          echo "::error::ApiService failed to start within timeout. Dumping diagnostics..."

          echo "----- ApiService process list -----"
          ps aux | grep -E "dotnet.*PersonalFinance.ApiService" || true

          echo "----- Tail 200 lines of .api.log -----"
          tail -n 200 .api.log || true

          echo "----- Listening sockets -----"
          ss -lntp || netstat -lntp || true

          exit 1

      - name: Start Web with InMemory DB
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DATABASE_PROVIDER: InMemory
          ConnectionStrings__DefaultConnection: InMemory:E2ETestWeb
          ApiSettings__BaseUrl: http://localhost:${{ steps.ports.outputs.api_port }}
          E2E_DISABLE_EMAIL_CONFIRMATION: "true"
        run: |
          echo "Starting Web on port ${{ steps.ports.outputs.web_port }} (logs -> .web.log)"
          dotnet run --project PersonalFinance/src/PersonalFinance.Web \
            --environment Development \
            --urls "http://0.0.0.0:${{ steps.ports.outputs.web_port }}" \
            > .web.log 2>&1 &
          sleep 1
          ps aux | grep -E "dotnet.*PersonalFinance.Web" || true
          echo "Web backgrounded; continuing to health check."

      - name: Wait for Web health
        run: |
          echo "Waiting for Web to start (port ${{ steps.ports.outputs.web_port }})..."
          MAX_RETRIES=50
          SLEEP_SECONDS=3
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -S --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "http://localhost:${{ steps.ports.outputs.web_port }}/health" 2>/dev/null || echo "000")
            echo "Attempt $i/$MAX_RETRIES: Web /health returned HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Web is healthy."
              exit 0
            fi
            sleep $SLEEP_SECONDS
          done

          echo "::error::Web failed to start within timeout. Dumping diagnostics..."

          echo "----- Web process list -----"
          ps aux | grep -E "dotnet.*PersonalFinance.Web" || true

          echo "----- Tail 200 lines of .web.log -----"
          tail -n 200 .web.log || true

          echo "----- Listening sockets -----"
          ss -lntp || netstat -lntp || true

          exit 1

      - name: Run Playwright UI E2E tests
        env:
          WEB_URL: http://localhost:${{ steps.ports.outputs.web_port }}
          API_URL: http://localhost:${{ steps.ports.outputs.api_port }}
        run: npm run test:e2e

      - name: Run API endpoint E2E tests
        env:
          API_URL: http://localhost:${{ steps.ports.outputs.api_port }}
        run: npm run test:api

      - name: Dump API root & endpoints on failure
        if: failure()
        env:
          API_PORT: ${{ steps.ports.outputs.api_port }}
        run: |
          echo "---- / ----"
          curl -sS -v "http://localhost:${API_PORT}/" || true
          echo "---- /openapi/v1.json ----"
          curl -sS -v "http://localhost:${API_PORT}/openapi/v1.json" || true
          echo "---- /api/NetWorth/Parameters ----"
          curl -sS -v "http://localhost:${API_PORT}/api/NetWorth/Parameters" || true
          echo "---- /api/Community/Stories ----"
          curl -sS -v "http://localhost:${API_PORT}/api/Community/Stories" || true
          echo "---- /api/Budget ----"
          curl -sS -v "http://localhost:${API_PORT}/api/Budget" || true
          echo "---- /api/SavingsGoals ----"
          curl -sS -v "http://localhost:${API_PORT}/api/SavingsGoals" || true
          echo "---- /api/Watchlist ----"
          curl -sS -v "http://localhost:${API_PORT}/api/Watchlist" || true
          echo "---- Tail .api.log ----"
          tail -n 400 .api.log || true

      - name: Stop services
        if: always()
        run: |
          echo "Stopping services..."
          pkill -f "dotnet.*PersonalFinance.ApiService" || true
          pkill -f "dotnet.*PersonalFinance.Web" || true
          sleep 2

  # ============================================================================
  # 1d. MIGRATIONS ON A REAL SQL SERVER (runs in parallel)
  # Starts SQL Server 2022 with the developers' compose.yaml and npm db:* scripts,
  # then runs the ApiService's production `--migrate-only` path twice: the first
  # run applies every migration and seeds data, the second must apply nothing.
  # A migration that SQL Server rejects fails here, before it can reach Azure SQL.
  # ============================================================================
  sql-server-migrations:
    name: Migrations on SQL Server 2022
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build ApiService (Release)
        run: dotnet build PersonalFinance/src/PersonalFinance.ApiService --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Throwaway sa password generated for this run only (no repository secret).
      # "Aa1!" guarantees SQL Server's complexity rules; the hex part makes it random.
      - name: Write .env with a random sa password
        run: |
          SA_PASSWORD="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::${SA_PASSWORD}"
          printf 'MSSQL_SA_PASSWORD=%s\nSQL_HOST_PORT=1433\n' "${SA_PASSWORD}" > .env

      - name: Start SQL Server (npm run db:up)
        run: npm run db:up

      - name: Apply migrations twice with --migrate-only
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -a; . ./.env; set +a
          export ConnectionStrings__DefaultConnection="Server=localhost,${SQL_HOST_PORT};Database=PersonalFinance;User ID=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=False"

          # A failed run exits non-zero; the grep only surfaces the key log lines for diagnostics.
          migrate() {
            local run="$1" log=".migrate-$1.log" status=0
            echo "Migration run ${run} (logs -> ${log})"
            dotnet run --project PersonalFinance/src/PersonalFinance.ApiService \
              --configuration Release --no-build --no-launch-profile \
              -- --migrate-only > "${log}" 2>&1 || status=$?
            grep -E "Applying [0-9]+ pending migration|schema is up to date|migration task finished" "${log}" || true
            if [ "${status}" -ne 0 ]; then
              echo "::error::Migration run ${run} exited with code ${status}."
              return 1
            fi
          }

          # Rows in __EFMigrationsHistory: the database's own record of applied migrations.
          applied_migrations() {
            docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -b -h -1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM PersonalFinance.dbo.__EFMigrationsHistory" | tr -d '[:space:]'
          }

          migrate 1
          first=$(applied_migrations)
          echo "Migrations recorded after run 1: ${first}"
          if [ -z "${first}" ] || [ "${first}" -eq 0 ]; then
            echo "::error::The first run applied no migrations to the empty database."
            exit 1
          fi

          migrate 2
          second=$(applied_migrations)
          echo "Migrations recorded after run 2: ${second}"
          if [ "${second}" != "${first}" ]; then
            echo "::error::The second run applied migrations again (${first} -> ${second}); they are not idempotent."
            exit 1
          fi
          echo "All migrations applied on SQL Server 2022, and a second run applied nothing."

      - name: Dump SQL Server and ApiService logs on failure
        if: failure()
        run: |
          echo "----- docker compose ps -----"
          docker compose ps -a || true
          echo "----- SQL Server container logs -----"
          docker compose logs --no-color --tail 300 sqlserver || true
          for log in .migrate-1.log .migrate-2.log; do
            if [ -f "${log}" ]; then
              echo "----- Tail 300 lines of ${log} -----"
              tail -n 300 "${log}"
            fi
          done

      - name: Stop SQL Server (npm run db:down)
        if: always()
        run: npm run db:down || true

  # ============================================================================
  # 1e. VALIDATE INFRASTRUCTURE TEMPLATES (runs in parallel with build-and-test)
  # ============================================================================
  validate-infra:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bicep infrastructure templates
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/local-dev.bicep --stdout > /dev/null

  # ============================================================================
  # 2. BUILD & PUSH MULTI-STAGE CONTAINERS (GHCR - $0.00 REGISTRY)
  # Runs in parallel with build-and-test (one matrix leg per image). Images are pushed
  # with the commit SHA tag only; deploy-azure still requires every check to pass, and
  # `latest` is moved by promote-latest only after a successful deploy + smoke test.
  # ============================================================================
  build-and-push-containers:
    name: Build & Push Containers (GHCR) · ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: PersonalFinance/src/PersonalFinance.ApiService/Dockerfile
          - service: web
            dockerfile: PersonalFinance/src/PersonalFinance.Web/Dockerfile
    env:
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' && inputs.dry_run != true }}
    outputs:
      # Deterministic from the commit SHA, so both matrix legs write identical values
      api_image_tag: ${{ steps.tags.outputs.api_image_tag }}
      web_image_tag: ${{ steps.tags.outputs.web_image_tag }}
      owner_lc: ${{ steps.tags.outputs.owner_lc }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Image Names and Tags
        id: tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          API_IMAGE="ghcr.io/${OWNER_LC}/${{ env.API_IMAGE_NAME }}"
          WEB_IMAGE="ghcr.io/${OWNER_LC}/${{ env.WEB_IMAGE_NAME }}"

          if [[ "${{ matrix.service }}" == "api" ]]; then IMAGE="$API_IMAGE"; else IMAGE="$WEB_IMAGE"; fi

          echo "owner_lc=${OWNER_LC}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "api_image_tag=${API_IMAGE}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "web_image_tag=${WEB_IMAGE}:${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ env.PUSH_IMAGE == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.tags.outputs.image }}
          tags: |
            type=sha,format=short,prefix=

      # Each image has its own cache scope so the two builds don't overwrite each other.
      # PRs only read the cache: exporting it (mode=max includes the SDK layers) costs
      # ~50s per image and a PR's cache can't be reused by other branches anyway.
      - name: Build and push ${{ matrix.service }} container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: ${{ env.PUSH_IMAGE == 'true' && format('type=gha,scope={0},mode=max,ignore-error=true', matrix.service) || '' }}

  # ============================================================================
  # 3. DEPLOY INFRASTRUCTURE & CONTAINER APPS (Bicep + Azure OIDC)
  # ============================================================================
  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: [build-and-test, sql-server-migrations, validate-infra, build-and-push-containers]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    outputs:
      web_url: ${{ steps.deploy-bicep.outputs.webUrl }}
      web_fqdn: ${{ steps.deploy-bicep.outputs.webFqdn }}
      api_fqdn: ${{ steps.deploy-bicep.outputs.apiFqdn }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via Passwordless OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure resource group exists
        uses: azure/cli@v2
        with:
          inlineScript: |
            # A resource group's location is immutable metadata only; resources inside it
            # are deployed to AZURE_LOCATION via the Bicep `location` parameter. Reuse an
            # existing group regardless of its region instead of failing on a mismatch.
            if [[ "$(az group exists --name "${{ env.AZURE_RESOURCE_GROUP }}")" == "true" ]]; then
              EXISTING_LOCATION=$(az group show --name "${{ env.AZURE_RESOURCE_GROUP }}" --query location --output tsv)
              echo "Resource group '${{ env.AZURE_RESOURCE_GROUP }}' already exists in '${EXISTING_LOCATION}'; resources will deploy to '${{ env.AZURE_LOCATION }}'."
              exit 0
            fi

            az group create \
              --name "${{ env.AZURE_RESOURCE_GROUP }}" \
              --location "${{ env.AZURE_LOCATION }}" \
              --tags Application=PersonalFinance Environment="${{ inputs.environment || env.ENVIRONMENT_NAME }}" ManagedBy=GitHubActions

      - name: Wait for stale Container Apps environment deletion
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          APP_ENVIRONMENT: ${{ inputs.environment || env.ENVIRONMENT_NAME }}
        with:
          inlineScript: |
            ENVIRONMENT_PREFIX="cae-${APP_ENVIRONMENT}-"
            ENVIRONMENT_NAME=$(az resource list \
              --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.App/managedEnvironments \
              --query "[?starts_with(name, '${ENVIRONMENT_PREFIX}')].name | [0]" \
              --output tsv)

            if [[ -z "$ENVIRONMENT_NAME" ]]; then
              echo "No existing Container Apps environment found."
              exit 0
            fi

            ENVIRONMENT_ID=$(az resource show \
              --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.App/managedEnvironments \
              --name "$ENVIRONMENT_NAME" \
              --query id \
              --output tsv)
            STATE=$(az resource show --ids "$ENVIRONMENT_ID" --query properties.provisioningState --output tsv 2>/dev/null || true)

            if [[ "$STATE" != "ScheduledForDelete" ]]; then
              echo "Container Apps environment '$ENVIRONMENT_NAME' is in state '$STATE'."
              exit 0
            fi

            echo "Container Apps environment '$ENVIRONMENT_NAME' is scheduled for deletion; waiting for Azure cleanup."
            for attempt in $(seq 1 30); do
              if ! az resource show --ids "$ENVIRONMENT_ID" --output none 2>/dev/null; then
                echo "Container Apps environment deletion completed."
                exit 0
              fi

              echo "Deletion still in progress (attempt $attempt/30); waiting 30 seconds."
              sleep 30
            done

            echo "::error::Container Apps environment '$ENVIRONMENT_NAME' remained scheduled for deletion after 15 minutes."
            exit 1

      - name: Validate database deployment configuration
        env:
          DEPLOY_SQL: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_sql == true }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          CUSTOM_CONNECTION_STRING: ${{ secrets.CUSTOM_CONNECTION_STRING }}
        run: |
          if [[ "$DEPLOY_SQL" == "true" && -z "$SQL_ADMIN_PASSWORD" ]]; then
            echo "::error::SQL_ADMIN_PASSWORD is required when Azure SQL deployment is enabled."
            exit 1
          fi

          if [[ "$DEPLOY_SQL" != "true" && -z "$CUSTOM_CONNECTION_STRING" ]]; then
            echo "::error::CUSTOM_CONNECTION_STRING is required when Azure SQL deployment is disabled."
            exit 1
          fi

      - name: Deploy Azure Infrastructure & Container Apps (Bicep)
        id: deploy-bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environmentName=${{ inputs.environment || env.ENVIRONMENT_NAME }}
            location=${{ env.AZURE_LOCATION }}
            sqlLocation=${{ env.AZURE_SQL_LOCATION }}
            apiImage=${{ needs.build-and-push-containers.outputs.api_image_tag }}
            webImage=${{ needs.build-and-push-containers.outputs.web_image_tag }}
            googleClientId=${{ secrets.GOOGLE_CLIENT_ID }}
            googleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}
            brevoApiKey=${{ secrets.BREVO_API_KEY }}
            brevoSenderEmail=${{ vars.BREVO_SENDER_EMAIL || 'tngo0508@gmail.com' }}
            brevoSenderName=${{ vars.BREVO_SENDER_NAME || 'PersonalFinance' }}
            googleDriveApiKey=${{ secrets.GOOGLE_DRIVE_API_KEY }}
            openAiApiKey=${{ secrets.OPENAI_API_KEY }}
            rbacAdminEmail=${{ vars.RBAC_ADMIN_EMAIL || 'tngo0508@gmail.com' }}
            internalApiKey=${{ secrets.INTERNAL_API_KEY }}
            secUserAgent=${{ vars.SEC_USER_AGENT || '' }}
            deploySqlDatabase=${{ github.event_name != 'workflow_dispatch' || inputs.deploy_sql == true }}
            sqlAdministratorLoginPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
            customConnectionString=${{ secrets.CUSTOM_CONNECTION_STRING }}
            customDomainName=${{ vars.CUSTOM_DOMAIN_NAME || '' }}
            exposeApiPublicly=true

      - name: Show Azure deployment operations on failure
        if: ${{ failure() }}
        uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
        with:
          inlineScript: |
            az deployment operation group list \
              --resource-group "$RESOURCE_GROUP" \
              --name main \
              --query "[].{state:properties.provisioningState,target:properties.targetResource.resourceName,error:properties.statusMessage.error.message}" \
              --output json

            for deployment in logAnalyticsDeployment containerEnvDeployment sqlDatabaseDeployment apiServiceDeployment webServiceDeployment; do
              az deployment operation group list \
                --resource-group "$RESOURCE_GROUP" \
                --name "$deployment" \
                --query "[].{state:properties.provisioningState,target:properties.targetResource.resourceName,error:properties.statusMessage.error.message}" \
                --output json 2>/dev/null || true
            done

  # ============================================================================
  # 4. END-TO-END POST-DEPLOYMENT SMOKE TESTS
  # ============================================================================
  smoke-test:
    name: End-to-End Smoke Tests
    needs: deploy-azure
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run HTTP Smoke Tests against Deployed Endpoints
        run: |
          WEB_URL="${{ needs.deploy-azure.outputs.web_url }}"
          WEB_FQDN="${{ needs.deploy-azure.outputs.web_fqdn }}"
          API_FQDN="${{ needs.deploy-azure.outputs.api_fqdn }}"

          echo "Deploy outputs:"
          echo "  needs.deploy-azure.outputs.web_url   = '${WEB_URL}'"
          echo "  needs.deploy-azure.outputs.web_fqdn  = '${WEB_FQDN}'"
          echo "  needs.deploy-azure.outputs.api_fqdn  = '${API_FQDN}'"

          if [ -z "$WEB_URL" ]; then
            if [ -n "$WEB_FQDN" ]; then
              WEB_URL="https://${WEB_FQDN}"
            fi
          fi

          # Normalize base URL (strip trailing slash)
          WEB_URL="${WEB_URL%/}"

          if [ -z "$WEB_URL" ] || [ "$WEB_URL" = "https://" ] || [ "$WEB_URL" = "http://" ]; then
            echo "::error::Target Web URL could not be resolved from deployment outputs."
            exit 1
          fi

          echo "Target WEB_URL: $WEB_URL"
          echo ""

          log_failure_details() {
            local path="$1"
            local headers_file="$2"
            local body_file="$3"
            echo "  -> Dumping response for ${path}:"
            echo "----- Response headers -----"
            sed -n '1,200p' "$headers_file" 2>/dev/null || true
            echo "----- Response body (first 400 bytes) -----"
            head -c 400 "$body_file" 2>/dev/null || true
            echo ""
            echo "----- end dump -----"
          }

          PASSED=0
          FAILED=0

          check_endpoint() {
            local label="$1"
            local path="$2"
            local expected_status="$3"
            local description="$4"

            echo ""
            echo "[${label}] Probing ${path}..."
            local HEAD_FILE=$(mktemp)
            local BODY_FILE=$(mktemp)
            local HTTP_CODE=$(curl -sS --connect-timeout 5 --max-time 15 -D "$HEAD_FILE" -o "$BODY_FILE" -w "%{http_code}" "${WEB_URL}${path}" 2>/dev/null || echo "000")
            echo "  -> ${path} returned HTTP ${HTTP_CODE}"

            if [ "$HTTP_CODE" = "$expected_status" ]; then
              echo "  -> ✓ ${description}"
              PASSED=$((PASSED + 1))
            else
              echo "  -> ✗ Expected HTTP ${expected_status}, got ${HTTP_CODE}  <-- FAIL: ${label} ${path}"
              FAILED=$((FAILED + 1))
              log_failure_details "${path}" "$HEAD_FILE" "$BODY_FILE"
            fi
          }

          check_endpoint_redirect() {
            local label="$1"
            local path="$2"
            local description="$3"

            echo ""
            echo "[${label}] Probing ${path} (expect redirect)..."
            local HEAD_FILE=$(mktemp)
            local BODY_FILE=$(mktemp)
            local HTTP_CODE=$(curl -sS --connect-timeout 5 --max-time 15 -D "$HEAD_FILE" -o "$BODY_FILE" -w "%{http_code}" "${WEB_URL}${path}" 2>/dev/null || echo "000")
            echo "  -> ${path} returned HTTP ${HTTP_CODE}"

            # Accept 301/302 as redirect, or 200 if the app renders a login page instead of redirecting
            if [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "  -> ✓ ${description}"
              PASSED=$((PASSED + 1))
            else
              echo "  -> ✗ Expected redirect (301/302) or login page (200), got HTTP ${HTTP_CODE}  <-- FAIL: ${label} ${path}"
              FAILED=$((FAILED + 1))
              log_failure_details "${path}" "$HEAD_FILE" "$BODY_FILE"
            fi
          }

          check_content() {
            local label="$1"
            local path="$2"
            local expected_content="$3"
            local description="$4"

            echo ""
            echo "[${label}] Checking ${path} for content..."
            local HEAD_FILE=$(mktemp)
            local BODY_FILE=$(mktemp)
            local HTTP_CODE=$(curl -sS --connect-timeout 5 --max-time 15 -D "$HEAD_FILE" -o "$BODY_FILE" -w "%{http_code}" "${WEB_URL}${path}" 2>/dev/null || echo "000")
            echo "  -> ${path} returned HTTP ${HTTP_CODE}"

            if head -c 100000 "$BODY_FILE" 2>/dev/null | grep -qi "$expected_content"; then
              echo "  -> ✓ ${description}"
              PASSED=$((PASSED + 1))
            else
              echo "  -> ✗ Expected content '${expected_content}' not found  <-- FAIL: ${label} ${path}"
              FAILED=$((FAILED + 1))
              log_failure_details "${path}" "$HEAD_FILE" "$BODY_FILE"
            fi
          }

          echo "================================================================"
          echo " Commencing smoke tests against target: ${WEB_URL}"
          echo " Note: ApiService (/scalar/v1, /openapi/v1.json) is internal-only"
          echo " (ingress external=false in ACA) and validated in CI test suite."
          echo "================================================================"

          # 1. Probe readiness endpoint (/health) with longer retry loop for cold-starts
          echo ""
          echo "[1/12] Probing readiness health endpoint (/health)..."
          MAX_RETRIES=60
          HEALTH_OK=false

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "${WEB_URL}/health" 2>/dev/null || echo "000")
            echo "Attempt $i/$MAX_RETRIES: /health returned HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "  -> Readiness probe passed (HTTP 200 OK)."
              PASSED=$((PASSED + 1))
              HEALTH_OK=true
              break
            fi
            sleep 5
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "::error::Readiness health probe timed out after ${MAX_RETRIES} attempts."
            FAILED=$((FAILED + 1))
            # Dump headers and body to help diagnose the failure
            tmphead=$(mktemp)
            tmpbody=$(mktemp)
            curl -sS -D "$tmphead" -o "$tmpbody" "${WEB_URL}/health" 2>/dev/null || true
            log_failure_details "/health" "$tmphead" "$tmpbody"
          fi

          # 2. Probe liveness endpoint (/alive)
          check_endpoint "2/12" "/alive" "200" "Liveness probe passed"

          # 3. Probe root UI page (/)
          echo ""
          echo "[3/12] Probing Web home page (/)..."
          ROOT_HEAD=$(mktemp)
          ROOT_BODY=$(mktemp)
          ROOT_CODE=$(curl -sS --connect-timeout 5 --max-time 15 -D "$ROOT_HEAD" -o "$ROOT_BODY" -w "%{http_code}" "${WEB_URL}/" 2>/dev/null || echo "000")
          echo "  -> / returned HTTP ${ROOT_CODE}"
          if [ "$ROOT_CODE" = "200" ] || [ "$ROOT_CODE" = "302" ]; then
            echo "  -> ✓ Home page probe passed (HTTP ${ROOT_CODE})."
            PASSED=$((PASSED + 1))
          else
            echo "  -> ✗ Home page probe failed with HTTP ${ROOT_CODE}."
            FAILED=$((FAILED + 1))
            log_failure_details "/" "$ROOT_HEAD" "$ROOT_BODY"
          fi

          # 4. Probe Identity login page (/Identity/Account/Login)
          check_endpoint "4/12" "/Identity/Account/Login" "200" "Identity login page loaded"

          # 5. Check login page content (form elements)
          check_content "5/12" "/Identity/Account/Login" "Email" "Login page contains email field"

          # 6. Check login page content (password field)
          check_content "6/12" "/Identity/Account/Login" "password" "Login page contains password field"

          # 7. Probe Register page
          check_endpoint "7/12" "/Identity/Account/Register" "200" "Register page loaded"

          # 8. Check Register page content
          check_content "8/12" "/Identity/Account/Register" "Register" "Register page contains registration form"

          # 9. Check Networth page redirects to login (auth required)
          check_endpoint_redirect "9/12" "/Networth" "Networth redirects to login (auth required)"

          # 10. Check News page redirects to login (auth required)
          check_endpoint_redirect "10/12" "/News" "News redirects to login (auth required)"

          # 11. Check Community page redirects to login (auth required)
          check_endpoint_redirect "11/12" "/Community" "Community redirects to login (auth required)"

          # 12. Check Budget page redirects to login (auth required)
          check_endpoint_redirect "12/12" "/Budget" "Budget redirects to login (auth required)"

          echo ""
          echo "================================================================"
          echo " Smoke Test Results"
          echo "================================================================"
          echo "  Passed: ${PASSED}"
          echo "  Failed: ${FAILED}"
          echo "================================================================"

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} smoke test(s) failed."
            exit 1
          fi

          echo " All post-deployment smoke tests passed successfully!"

  # ============================================================================
  # 5. PROMOTE DEPLOYED IMAGES TO `latest` (only after deploy + smoke tests pass)
  # ============================================================================
  promote-latest:
    name: Promote Images to latest
    needs: [build-and-push-containers, smoke-test]
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag deployed images as latest
        env:
          API_IMAGE_TAG: ${{ needs.build-and-push-containers.outputs.api_image_tag }}
          WEB_IMAGE_TAG: ${{ needs.build-and-push-containers.outputs.web_image_tag }}
        run: |
          # Re-points the manifest; no layers are pulled or pushed
          for IMAGE_TAG in "$API_IMAGE_TAG" "$WEB_IMAGE_TAG"; do
            docker buildx imagetools create --tag "${IMAGE_TAG%:*}:latest" "$IMAGE_TAG"
            echo "  -> ${IMAGE_TAG%:*}:latest now points to ${IMAGE_TAG##*:}"
          done

  # ============================================================================
  # 6. GITHUB RELEASE v{AppVersion.Current} (only after deploy + smoke tests pass)
  # ============================================================================
  # One Release per merged PR (docs/adr/0006-one-release-per-merged-pr.md). release-check.yml makes PRs bump AppVersion
  # and add its CHANGELOG section; here an existing tag (no bump, or a re-run) skips instead of failing the deployment.
  create-release:
    name: Create GitHub Release
    needs: smoke-test
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release from AppVersion and CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(bash .github/scripts/release-version.sh current)
          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::Tag $TAG already exists, so no Release was created. Bump AppVersion to release this change."
            echo "No Release: $TAG already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          bash .github/scripts/release-version.sh notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"

          # A version with a suffix (e.g. 4.2.0-rc.1) is a pre-release and never becomes "Latest"
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          else
            RELEASE_FLAGS=(--latest)
          fi

          # The CHANGELOG section comes first; --generate-notes appends the merged PRs since the previous Release
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            "${RELEASE_FLAGS[@]}"

          echo "Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG) at ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
