name: Build, Test, and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
    paths-ignore:
      # Docs and IDE settings don't affect the build or deployment
      - '**/*.md'
      - '.idea/**'
      - '.junie/**'
      - '.claude/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      # Docs and IDE settings don't affect the build or deployment
      - '**/*.md'
      - '.idea/**'
      - '.junie/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Azure Environment Name prefix (e.g. pf-prod)'
        required: false
        default: 'pf-prod'
        type: string
      deploy_sql:
        description: 'Provision Azure SQL Database Serverless Free Tier ($0.00)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry-run validation / What-If only (skip container push and Azure deployment)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

# One run per PR / branch. A new push to a PR cancels its in-progress run; runs on main
# queue instead of cancelling so an Azure deployment is never interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: personalfinance-api
  WEB_IMAGE_NAME: personalfinance-web
  AZURE_RESOURCE_GROUP: rg-personalfinance-prod
  AZURE_LOCATION: westus2
  AZURE_SQL_LOCATION: westus2
  ENVIRONMENT_NAME: pf-prod

jobs:
  # ============================================================================
  # 1. BUILD & AUTOMATED TEST SUITE (.NET 10)
  # ============================================================================
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The Release build of the Web project minifies its JS and CSS with Node (spec #286), on the Dockerfile's Node 22.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore NuGet packages
        run: dotnet restore PersonalFinance.sln

      - name: Build solution (Release)
        run: dotnet build PersonalFinance.sln --configuration Release --no-restore -p:EnforceWarningsAsErrors=true

      # Reports .editorconfig formatting drift without failing the build (fix locally with `dotnet format`).
      # Make it blocking by removing continue-on-error once main is clean.
      - name: Check code formatting (non-blocking)
        continue-on-error: true
        run: dotnet format whitespace PersonalFinance.sln --verify-no-changes --no-restore --exclude PersonalFinance/src/PersonalFinance.Web/wwwroot/lib PersonalFinance/src/PersonalFinance.Data/Migrations

      - name: Execute test suite
        run: dotnet test PersonalFinance.sln --configuration Release --no-build --verbosity normal

      # Production serves only the minified wwwroot/dist assets (spec #286). Publish the Web project and fail
      # if dist or its .br/.gz siblings are missing, a .map is published, or unminified source or tooling remains.
      - name: Check Web publish output
        run: |
          node --test PersonalFinance/src/PersonalFinance.Web/tools/check-publish.test.js
          dotnet publish PersonalFinance/src/PersonalFinance.Web --configuration Release --no-restore -o "$RUNNER_TEMP/web-publish"
          node PersonalFinance/src/PersonalFinance.Web/tools/check-publish.js "$RUNNER_TEMP/web-publish"

  # ============================================================================
  # 1b. JAVASCRIPT LINT — ESLint (runs in parallel)
  # ============================================================================
  lint-js:
    name: Lint JavaScript (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint JavaScript files
        run: npm run lint

      # Translations (ADR 0015): reports missing, stale and unreferenced keys to the job summary without failing;
      # fails only on malformed resource JSON or a translation whose placeholders differ from the English.
      - name: i18n-report
        run: |
          npm run test:i18n
          npm run i18n:report

  # ============================================================================
  # 1c. E2E BROWSER TESTS — Playwright UI + API endpoint tests (runs in parallel)
  # Starts both ApiService and Web locally with InMemory DB, runs browser-based
  # E2E tests against the Web URL and curl-based tests against the API URL.
  # ============================================================================
  e2e-browser-tests:
    name: E2E Browser Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Before the build: the Release build of the Web project minifies its JS and CSS with Node (spec #286).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore and build solution
        run: |
          dotnet restore PersonalFinance.sln
          dotnet build PersonalFinance.sln --configuration Release --no-restore -p:EnforceWarningsAsErrors=true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install npm dependencies
        run: npm ci

      - name: Assign random ports
        id: ports
        run: |
          API_PORT=$((RANDOM % 10000 + 10000))
          WEB_PORT=$((RANDOM % 10000 + 10000))
          echo "api_port=$API_PORT" >> $GITHUB_OUTPUT
          echo "web_port=$WEB_PORT" >> $GITHUB_OUTPUT

      - name: Start ApiService with InMemory DB
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DATABASE_PROVIDER: InMemory
          ConnectionStrings__DefaultConnection: InMemory:E2ETestApi
          # Stores small Research fixture snapshots (Development only), so the walkthrough needs no SEC/World Bank.
          E2E_SEED_RESEARCH: "true"
          # The Atelier smoke reads the fixture Term Entries: the real content folder has none until the content slices.
          Learning__ContentPath: ${{ github.workspace }}/PersonalFinance/tests/PersonalFinance.Tests/Learning/Fixtures/Content
        run: |
          echo "Starting ApiService on port ${{ steps.ports.outputs.api_port }} (logs -> .api.log)"
          dotnet run --project PersonalFinance/src/PersonalFinance.ApiService \
            --environment Development \
            --urls "http://0.0.0.0:${{ steps.ports.outputs.api_port }}" \
            > .api.log 2>&1 &
          sleep 1
          ps aux | grep -E "dotnet.*PersonalFinance.ApiService" || true
          echo "ApiService backgrounded; continuing to health check."

      - name: Wait for ApiService health
        run: |
          echo "Waiting for ApiService to start (port ${{ steps.ports.outputs.api_port }})..."
          MAX_RETRIES=50
          SLEEP_SECONDS=3
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -S --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "http://localhost:${{ steps.ports.outputs.api_port }}/health" 2>/dev/null || echo "000")
            echo "Attempt $i/$MAX_RETRIES: ApiService /health returned HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "ApiService is healthy."
              exit 0
            fi
            sleep $SLEEP_SECONDS
          done

          echo "::error::ApiService failed to start within timeout. Dumping diagnostics..."

          echo "----- ApiService process list -----"
          ps aux | grep -E "dotnet.*PersonalFinance.ApiService" || true

          echo "----- Tail 200 lines of .api.log -----"
          tail -n 200 .api.log || true

          echo "----- Listening sockets -----"
          ss -lntp || netstat -lntp || true

          exit 1

      - name: Start Web with InMemory DB
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DATABASE_PROVIDER: InMemory
          ConnectionStrings__DefaultConnection: InMemory:E2ETestWeb
          ApiSettings__BaseUrl: http://localhost:${{ steps.ports.outputs.api_port }}
          E2E_DISABLE_EMAIL_CONFIRMATION: "true"
        run: |
          echo "Starting Web on port ${{ steps.ports.outputs.web_port }} (logs -> .web.log)"
          dotnet run --project PersonalFinance/src/PersonalFinance.Web \
            --environment Development \
            --urls "http://0.0.0.0:${{ steps.ports.outputs.web_port }}" \
            > .web.log 2>&1 &
          sleep 1
          ps aux | grep -E "dotnet.*PersonalFinance.Web" || true
          echo "Web backgrounded; continuing to health check."

      - name: Wait for Web health
        run: |
          echo "Waiting for Web to start (port ${{ steps.ports.outputs.web_port }})..."
          MAX_RETRIES=50
          SLEEP_SECONDS=3
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -S --connect-timeout 5 --max-time 10 -o /dev/null -w "%{http_code}" "http://localhost:${{ steps.ports.outputs.web_port }}/health" 2>/dev/null || echo "000")
            echo "Attempt $i/$MAX_RETRIES: Web /health returned HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Web is healthy."
              exit 0
            fi
            sleep $SLEEP_SECONDS
          done

          echo "::error::Web failed to start within timeout. Dumping diagnostics..."

          echo "----- Web process list -----"
          ps aux | grep -E "dotnet.*PersonalFinance.Web" || true

          echo "----- Tail 200 lines of .web.log -----"
          tail -n 200 .web.log || true

          echo "----- Listening sockets -----"
          ss -lntp || netstat -lntp || true

          exit 1

      - name: Run Playwright UI E2E tests
        env:
          WEB_URL: http://localhost:${{ steps.ports.outputs.web_port }}
          API_URL: http://localhost:${{ steps.ports.outputs.api_port }}
        run: npm run test:e2e

      - name: Run API endpoint E2E tests
        env:
          API_URL: http://localhost:${{ steps.ports.outputs.api_port }}
        run: npm run test:api

      - name: Dump API root & endpoints on failure
        if: failure()
        env:
          API_PORT: ${{ steps.ports.outputs.api_port }}
        run: |
          echo "---- / ----"
          curl -sS -v "http://localhost:${API_PORT}/" || true
          echo "---- /openapi/v1.json ----"
          curl -sS -v "http://localhost:${API_PORT}/openapi/v1.json" || true
          echo "---- /api/NetWorth/Parameters ----"
          curl -sS -v "http://localhost:${API_PORT}/api/NetWorth/Parameters" || true
          echo "---- /api/Community/Stories ----"
          curl -sS -v "http://localhost:${API_PORT}/api/Community/Stories" || true
          echo "---- /api/Budget ----"
          curl -sS -v "http://localhost:${API_PORT}/api/Budget" || true
          echo "---- /api/SavingsGoals ----"
          curl -sS -v "http://localhost:${API_PORT}/api/SavingsGoals" || true
          echo "---- /api/Watchlist ----"
          curl -sS -v "http://localhost:${API_PORT}/api/Watchlist" || true
          echo "---- Tail .api.log ----"
          tail -n 400 .api.log || true

      - name: Stop services
        if: always()
        run: |
          echo "Stopping services..."
          pkill -f "dotnet.*PersonalFinance.ApiService" || true
          pkill -f "dotnet.*PersonalFinance.Web" || true
          sleep 2

  # ============================================================================
  # 1d. MIGRATIONS ON A REAL SQL SERVER (runs in parallel)
  # Starts SQL Server 2022 with the developers' compose.yaml and npm db:* scripts,
  # then runs the ApiService's production `--migrate-only` path twice: the first
  # run applies every migration and seeds data, the second must apply nothing.
  # A migration that SQL Server rejects fails here, before it can reach Azure SQL.
  # ============================================================================
  sql-server-migrations:
    name: Migrations on SQL Server 2022
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build ApiService (Release)
        run: dotnet build PersonalFinance/src/PersonalFinance.ApiService --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Throwaway sa password generated for this run only (no repository secret).
      # "Aa1!" guarantees SQL Server's complexity rules; the hex part makes it random.
      - name: Write .env with a random sa password
        run: |
          SA_PASSWORD="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::${SA_PASSWORD}"
          printf 'MSSQL_SA_PASSWORD=%s\nSQL_HOST_PORT=1433\n' "${SA_PASSWORD}" > .env

      - name: Start SQL Server (npm run db:up)
        run: npm run db:up

      - name: Apply migrations twice with --migrate-only
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -a; . ./.env; set +a
          export ConnectionStrings__DefaultConnection="Server=localhost,${SQL_HOST_PORT};Database=PersonalFinance;User ID=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=False"

          # A failed run exits non-zero; the grep only surfaces the key log lines for diagnostics.
          migrate() {
            local run="$1" log=".migrate-$1.log" status=0
            echo "Migration run ${run} (logs -> ${log})"
            dotnet run --project PersonalFinance/src/PersonalFinance.ApiService \
              --configuration Release --no-build --no-launch-profile \
              -- --migrate-only > "${log}" 2>&1 || status=$?
            grep -E "Applying [0-9]+ pending migration|schema is up to date|migration task finished" "${log}" || true
            if [ "${status}" -ne 0 ]; then
              echo "::error::Migration run ${run} exited with code ${status}."
              return 1
            fi
          }

          # Rows in __EFMigrationsHistory: the database's own record of applied migrations.
          applied_migrations() {
            docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -b -h -1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM PersonalFinance.dbo.__EFMigrationsHistory" | tr -d '[:space:]'
          }

          migrate 1
          first=$(applied_migrations)
          echo "Migrations recorded after run 1: ${first}"
          if [ -z "${first}" ] || [ "${first}" -eq 0 ]; then
            echo "::error::The first run applied no migrations to the empty database."
            exit 1
          fi

          migrate 2
          second=$(applied_migrations)
          echo "Migrations recorded after run 2: ${second}"
          if [ "${second}" != "${first}" ]; then
            echo "::error::The second run applied migrations again (${first} -> ${second}); they are not idempotent."
            exit 1
          fi
          echo "All migrations applied on SQL Server 2022, and a second run applied nothing."

      - name: Dump SQL Server and ApiService logs on failure
        if: failure()
        run: |
          echo "----- docker compose ps -----"
          docker compose ps -a || true
          echo "----- SQL Server container logs -----"
          docker compose logs --no-color --tail 300 sqlserver || true
          for log in .migrate-1.log .migrate-2.log; do
            if [ -f "${log}" ]; then
              echo "----- Tail 300 lines of ${log} -----"
              tail -n 300 "${log}"
            fi
          done

      - name: Stop SQL Server (npm run db:down)
        if: always()
        run: npm run db:down || true

  # ============================================================================
  # 1e. VALIDATE INFRASTRUCTURE TEMPLATES (runs in parallel with build-and-test)
  # ============================================================================
  validate-infra:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bicep infrastructure templates
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/local-dev.bicep --stdout > /dev/null

  # ============================================================================
  # 2. BUILD & PUSH MULTI-STAGE CONTAINERS (GHCR - $0.00 REGISTRY)
  # Runs in parallel with build-and-test (one matrix leg per image). Images are pushed
  # with the commit SHA tag only; deploy-azure still requires every check to pass, and
  # `latest` is moved by promote-latest only after a successful deploy + smoke test.
  # ============================================================================
  build-and-push-containers:
    name: Build & Push Containers (GHCR) · ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: PersonalFinance/src/PersonalFinance.ApiService/Dockerfile
          - service: web
            dockerfile: PersonalFinance/src/PersonalFinance.Web/Dockerfile
    env:
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' && inputs.dry_run != true }}
    outputs:
      # Deterministic from the commit SHA, so both matrix legs write identical values
      api_image_tag: ${{ steps.tags.outputs.api_image_tag }}
      web_image_tag: ${{ steps.tags.outputs.web_image_tag }}
      owner_lc: ${{ steps.tags.outputs.owner_lc }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Image Names and Tags
        id: tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          API_IMAGE="ghcr.io/${OWNER_LC}/${{ env.API_IMAGE_NAME }}"
          WEB_IMAGE="ghcr.io/${OWNER_LC}/${{ env.WEB_IMAGE_NAME }}"

          if [[ "${{ matrix.service }}" == "api" ]]; then IMAGE="$API_IMAGE"; else IMAGE="$WEB_IMAGE"; fi

          # Stamped into the published assemblies with -p:Version (the Dockerfiles' APP_VERSION build-arg)
          echo "app_version=$(bash .github/scripts/release-version.sh current)" >> $GITHUB_OUTPUT
          echo "owner_lc=${OWNER_LC}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "api_image_tag=${API_IMAGE}:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "web_image_tag=${WEB_IMAGE}:${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ env.PUSH_IMAGE == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.tags.outputs.image }}
          tags: |
            type=sha,format=short,prefix=

      # Each image has its own cache scope so the two builds don't overwrite each other.
      # PRs only read the cache: exporting it costs ~50s per image and a PR's cache can't be
      # reused by other branches anyway. mode=min caches only the final image's layers: mode=max
      # also stored every SDK and build-stage layer, which filled most of the repo's 10 GB
      # Actions cache. cache-cleanup.yml prunes the blobs that later builds stop using.
      - name: Build and push ${{ matrix.service }} container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.app_version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: ${{ env.PUSH_IMAGE == 'true' && format('type=gha,scope={0},mode=min,ignore-error=true', matrix.service) || '' }}

  # ============================================================================
  # 3. DEPLOY INFRASTRUCTURE & CONTAINER APPS (Bicep + Azure OIDC)
  # ============================================================================
  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: [build-and-test, sql-server-migrations, validate-infra, build-and-push-containers]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    outputs:
      web_url: ${{ steps.deploy-bicep.outputs.webUrl }}
      web_fqdn: ${{ steps.deploy-bicep.outputs.webFqdn }}
      api_fqdn: ${{ steps.deploy-bicep.outputs.apiFqdn }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login, resource group, Bicep and the failure dump live in .github/actions/deploy-azure, shared with rollback.yml
      - name: Deploy Azure Infrastructure & Container Apps (Bicep)
        id: deploy-bicep
        uses: ./.github/actions/deploy-azure
        with:
          environment: ${{ inputs.environment || env.ENVIRONMENT_NAME }}
          deploy_sql: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_sql == true }}
          api_image: ${{ needs.build-and-push-containers.outputs.api_image_tag }}
          web_image: ${{ needs.build-and-push-containers.outputs.web_image_tag }}
          resource_group: ${{ env.AZURE_RESOURCE_GROUP }}
          location: ${{ env.AZURE_LOCATION }}
          sql_location: ${{ env.AZURE_SQL_LOCATION }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          brevo_api_key: ${{ secrets.BREVO_API_KEY }}
          brevo_sender_email: ${{ vars.BREVO_SENDER_EMAIL || 'tngo0508@gmail.com' }}
          brevo_sender_name: ${{ vars.BREVO_SENDER_NAME || 'PersonalFinance' }}
          google_drive_api_key: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          rbac_admin_email: ${{ vars.RBAC_ADMIN_EMAIL || 'tngo0508@gmail.com' }}
          internal_api_key: ${{ secrets.INTERNAL_API_KEY }}
          sec_user_agent: ${{ vars.SEC_USER_AGENT || '' }}
          sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          custom_connection_string: ${{ secrets.CUSTOM_CONNECTION_STRING }}
          custom_domain_name: ${{ vars.CUSTOM_DOMAIN_NAME || '' }}
          custom_domain_certificate_id: ${{ vars.CUSTOM_DOMAIN_CERTIFICATE_ID || '' }}

  # ============================================================================
  # 4. END-TO-END POST-DEPLOYMENT SMOKE TESTS
  # ============================================================================
  smoke-test:
    name: End-to-End Smoke Tests
    needs: deploy-azure
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same script as rollback.yml (.github/actions/smoke-test)
      - name: Run HTTP Smoke Tests against Deployed Endpoints
        uses: ./.github/actions/smoke-test
        with:
          web_url: ${{ needs.deploy-azure.outputs.web_url }}
          web_fqdn: ${{ needs.deploy-azure.outputs.web_fqdn }}
          api_fqdn: ${{ needs.deploy-azure.outputs.api_fqdn }}

  # ============================================================================
  # 5. PROMOTE DEPLOYED IMAGES TO `latest` (only after deploy + smoke tests pass)
  # ============================================================================
  promote-latest:
    name: Promote Images to latest
    needs: [build-and-push-containers, smoke-test]
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag deployed images as latest
        env:
          API_IMAGE_TAG: ${{ needs.build-and-push-containers.outputs.api_image_tag }}
          WEB_IMAGE_TAG: ${{ needs.build-and-push-containers.outputs.web_image_tag }}
        run: |
          # Re-points the manifest; no layers are pulled or pushed
          for IMAGE_TAG in "$API_IMAGE_TAG" "$WEB_IMAGE_TAG"; do
            docker buildx imagetools create --tag "${IMAGE_TAG%:*}:latest" "$IMAGE_TAG"
            echo "  -> ${IMAGE_TAG%:*}:latest now points to ${IMAGE_TAG##*:}"
          done

  # ============================================================================
  # 6. GITHUB RELEASE v{AppVersion.Current} (only after deploy + smoke tests pass)
  # ============================================================================
  # One Release per merged PR (docs/adr/0006-one-release-per-merged-pr.md). release-check.yml makes PRs bump AppVersion
  # and add its CHANGELOG section; here an existing tag (no bump, or a re-run) skips instead of failing the deployment.
  create-release:
    name: Create GitHub Release
    needs: smoke-test
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release from AppVersion and CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(bash .github/scripts/release-version.sh current)
          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::Tag $TAG already exists, so no Release was created. Bump AppVersion to release this change."
            echo "No Release: $TAG already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          bash .github/scripts/release-version.sh notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"

          # A version with a suffix (e.g. 4.2.0-rc.1) is a pre-release and never becomes "Latest"
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          else
            RELEASE_FLAGS=(--latest)
          fi

          # The CHANGELOG section comes first; --generate-notes appends the merged PRs since the previous Release
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            "${RELEASE_FLAGS[@]}"

          echo "Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG) at ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
