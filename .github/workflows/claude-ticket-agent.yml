name: Claude Ticket Agent

# Picks one ready-for-agent issue, implements it with /implement (tdd + code-review), and opens a PR for a human to
# review and merge. Works back to back from 00:00 to 19:00 US Pacific every day and stays off 19:00-24:00, when the
# owner reviews PRs and works locally. The rules live in docs/agents/issue-tracker.md under "Scheduled ticket agent".
on:
  schedule:
    # Every 30 minutes across the UTC hours that cover 00:00-19:00 Pacific in both PDT and PST. The pick job applies
    # the exact Pacific window, so DST needs no cron change. With the concurrency group below, a tick that lands
    # during a run waits and starts as soon as that run ends.
    - cron: '17,47 0-3,7-23 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to work on (optional; default: oldest eligible ready-for-agent issue)'
        required: false
      chained:
        description: 'Set by the chain job: this run keeps the working window, like a scheduled one'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-ticket-agent
  cancel-in-progress: false

env:
  # Agent branches use their own prefix so the open-PR cap never counts PRs from human claude/* sessions.
  BRANCH_PREFIX: agent/issue-
  MAX_OPEN_AGENT_PRS: 5
  # Scheduled runs work only between midnight and QUIET_FROM (Pacific), and must end by QUIET_FROM.
  QUIET_FROM: '19:00'
  MIN_MINUTES_TO_START: 45
  MAX_RUN_MINUTES: 90

jobs:
  pick:
    name: Pick a ticket
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
      rebase_pr: ${{ steps.pick.outputs.rebase_pr }}
      branch: ${{ steps.pick.outputs.branch }}
      minutes: ${{ steps.pick.outputs.minutes }}
    steps:
      - name: Choose a stale PR to rebase, or claim an issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          CHAINED: ${{ inputs.chained }}
        run: |
          set -euo pipefail

          # Working window. Manual runs ignore it and get the full run time; chained runs keep it.
          minutes="$MAX_RUN_MINUTES"
          if [ "$EVENT" = "schedule" ] || [ "$CHAINED" = "true" ]; then
            now=$(( 10#$(TZ=America/Los_Angeles date +%H) * 60 + 10#$(TZ=America/Los_Angeles date +%M) ))
            quiet=$(( 10#${QUIET_FROM%%:*} * 60 + 10#${QUIET_FROM##*:} ))
            left=$(( quiet - now ))
            if [ "$left" -lt "$MIN_MINUTES_TO_START" ]; then
              echo "::notice::Quiet window (Pacific $(TZ=America/Los_Angeles date +%H:%M)): the agent works 00:00-$QUIET_FROM only."
              echo "issue=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$left" -lt "$minutes" ] && minutes="$left"
          fi
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

          # A stale agent PR comes first, cap or not: once a sibling merges, the others conflict on AppVersion and
          # CHANGELOG.md and can never merge. One rebase is the whole run. A PR whose rebase failed waits for a human.
          if [ -z "$REQUESTED" ]; then
            stale=$(gh pr list --state open --limit 100 --json number,headRefName,isDraft,mergeable,labels --jq "
              [.[] | select((.headRefName | startswith(\"$BRANCH_PREFIX\")) and (.isDraft | not)
                and .mergeable == \"CONFLICTING\"
                and ([.labels[].name] | index(\"agent:rebase-failed\") | not))]
              | sort_by(.number) | .[0] // empty | \"\(.number) \(.headRefName)\"")
            if [ -n "$stale" ]; then
              read -r stale_pr stale_branch <<< "$stale"
              gh label create "agent:rebase-failed" --color D93F0B \
                --description "The scheduled agent could not rebase this PR" 2>/dev/null || true
              gh pr comment "$stale_pr" --body "🤖 The scheduled Claude agent is rebasing this PR onto main: $RUN_URL"
              echo "rebase_pr=$stale_pr" >> "$GITHUB_OUTPUT"
              echo "branch=$stale_branch" >> "$GITHUB_OUTPUT"
              echo "issue=" >> "$GITHUB_OUTPUT"
              echo "::notice::Rebasing stale PR #$stale_pr ($stale_branch)"
              exit 0
            fi
          fi

          # Drafts count toward the cap: a stuck draft is still work waiting on a human.
          open_agent_prs=$(gh pr list --state open --limit 100 --json headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\"))] | length")
          if [ "$open_agent_prs" -ge "$MAX_OPEN_AGENT_PRS" ]; then
            echo "::notice::$open_agent_prs agent PRs are open (cap $MAX_OPEN_AGENT_PRS). Review or close them to resume."
            echo "issue=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Issues an open PR already closes are taken.
          taken=$(gh pr list --state open --limit 100 --json closingIssuesReferences \
            --jq '[.[].closingIssuesReferences[].number] | unique | join(" ")')

          eligible() {
            local n="$1" info
            info=$(gh api "repos/$GH_REPO/issues/$n")
            [ "$(jq -r '.state' <<< "$info")" = "open" ] || return 1
            jq -e '[.labels[].name] | index("ready-for-agent")' <<< "$info" > /dev/null || return 1
            jq -e '[.labels[].name] | (index("agent:in-progress") or index("wayfinder:map")) | not' <<< "$info" > /dev/null || return 1
            [ "$(jq '.assignees | length' <<< "$info")" = "0" ] || return 1
            [ "$(jq '.sub_issues_summary.total // 0' <<< "$info")" = "0" ] || return 1
            [ "$(jq '.issue_dependencies_summary.blocked_by // 0' <<< "$info")" = "0" ] || return 1
            case " $taken " in *" $n "*) return 1 ;; esac
            return 0
          }

          issue=""
          if [ -n "$REQUESTED" ]; then
            if ! [[ "$REQUESTED" =~ ^[0-9]+$ ]]; then
              echo "::error::The issue input must be a number."
              exit 1
            fi
            if eligible "$REQUESTED"; then
              issue="$REQUESTED"
            else
              echo "::error::Issue #$REQUESTED is not eligible (needs ready-for-agent, open, unassigned, no sub-issues, no open blockers, no open PR)."
              exit 1
            fi
          else
            for n in $(gh issue list --state open --label ready-for-agent --limit 100 \
                --json number,createdAt --jq 'sort_by(.createdAt) | .[].number'); do
              if eligible "$n"; then issue="$n"; break; fi
            done
          fi

          if [ -z "$issue" ]; then
            echo "::notice::No eligible ready-for-agent issue."
            echo "issue=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh label create "agent:in-progress" --color FBCA04 \
            --description "The scheduled Claude agent is working on this" 2>/dev/null || true
          gh issue edit "$issue" --add-label "agent:in-progress"
          gh issue comment "$issue" --body "🤖 The scheduled Claude agent picked this up: $RUN_URL"

          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH_PREFIX}${issue}" >> "$GITHUB_OUTPUT"
          echo "::notice::Picked #$issue"

  implement:
    name: Implement, review, open PR
    needs: pick
    if: needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    # Shortened near QUIET_FROM so a late scheduled run still ends before the quiet window.
    timeout-minutes: ${{ fromJSON(needs.pick.outputs.minutes) }}
    env:
      ISSUE: ${{ needs.pick.outputs.issue }}
      BRANCH: ${{ needs.pick.outputs.branch }}
    steps:
      # The agent pushes and opens its PR as the claude GitHub App, which triggers CI and lets it request the
      # owner's review. AGENT_GH_TOKEN (the owner's PAT) is used only by Agent Auto-Merge.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm packages
        run: npm ci

      # Playwright's Chromium, for the E2E suites the agent runs with .github/scripts/e2e-inmemory.sh: both apps on the
      # InMemory provider, as CI's E2E job runs them, so the runner needs no database.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Create the agent branch
        run: git checkout -b "$BRANCH"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Chained runs are dispatched by the chain job, so their actor is github-actions[bot].
          allowed_bots: github-actions
          additional_permissions: |
            actions: read
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Agent,Skill,TodoWrite,Bash(bash .github/scripts/agent-version-check.sh:*),Bash(bash .github/scripts/e2e-inmemory.sh:*),Bash(dotnet:*),Bash(npm:*),Bash(git:*),Bash(gh:*),Bash(jq:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*)"
          prompt: |
            /implement ${{ env.ISSUE }}

            You are the unattended scheduled ticket agent for ${{ github.repository }}. No human is watching this run.
            Work on issue #${{ env.ISSUE }} only, on the already checked-out branch `${{ env.BRANCH }}`.
            This job is killed ${{ needs.pick.outputs.minutes }} minutes after it starts (about 5 go on setup). If
            the work will not fit, commit what you have, push it, and open a --draft PR that says what is left, rather
            than being cut off with nothing pushed.

            Before you start:
            - Read AGENTS.md and docs/CODING_STANDARDS.md, then `gh issue view ${{ env.ISSUE }} --comments`.
            - If the issue is ambiguous or needs a product or design decision, do not guess: comment your questions on
              the issue, then `gh issue edit ${{ env.ISSUE }} --remove-label ready-for-agent --add-label needs-info`,
              and stop without opening a PR.
            - If the work needs an EF Core schema migration and the issue is not labelled `agent:migration-ok`: comment
              why on the issue, then `gh issue edit ${{ env.ISSUE }} --remove-label ready-for-agent --add-label ready-for-human`,
              and stop without opening a PR. With that label, generate the migration and inspect it, never apply it,
              and flag it in bold at the top of the PR body.
            - User-facing text: add keys to `Resources/i18n/en.json` only. Never edit `vi.json` or `i18n.lock.json`,
              never hand-type Vietnamese, and never run the translator (`i18n:translate`; this runner has no Translator
              key). The i18n Translate workflow drafts the Vietnamese on your PR after you push, so never open a draft
              or wait because of translation.

            Implement (pick -> implement -> code review -> open PR, in that order):
            1. Implement with the tdd and dotnet-feature-workflow skills. Commit to `${{ env.BRANCH }}`.
            2. Run the code-review skill against `origin/main`. Fix every finding you agree is a real defect, then re-run
               the checks.
            3. Checks, all must pass before the PR: `dotnet test PersonalFinance.sln`, "npm run lint", and the E2E
               suites: `bash .github/scripts/e2e-inmemory.sh` starts both apps on the InMemory provider (this runner
               has no database and needs none for this) and runs "npm run test:e2e" and "npm run test:api" as CI's
               E2E job does. Run it whenever you touched `e2e-tests/` or PersonalFinance.Web (views, JavaScript, CSS):
               an E2E check you wrote but never ran fails in CI (#545 did). Fix what fails and list the result in
               the PR. Skip it only for a change outside both, and say so in the PR.
            4. Done checklist from AGENTS.md: bump AppVersion (Current, Major, Minor, Patch together) and add the
               CHANGELOG.md section `## [x.y.z] - YYYY-MM-DD` at the top. Choose a version above both `main` and every
               open PR from an `agent/issue-*` branch, so parallel PRs never collide. Update docs/DIAGRAMS.md if you
               add an Entity or Feature.
            5. Right before pushing, because main and the other agent PRs move while you work:
               `git fetch origin main && git rebase origin/main` (keep main's AppVersion.cs and CHANGELOG.md sections,
               re-apply yours on top), then `bash .github/scripts/agent-version-check.sh ${{ env.BRANCH }}`. It applies
               the release check's rules and lists every problem: re-bump or fix the CHANGELOG as it says, commit, and
               re-run it until it prints OK. If the rebase brought in code, re-run `dotnet test PersonalFinance.sln`
               (and the E2E script, if step 3 called for it). Never open a PR while it fails.
            6. Push `${{ env.BRANCH }}` and open the PR with the pr skill: base `main`, `--reviewer tngo0508`, the body
               starts with `Closes #${{ env.ISSUE }}`, and lists the commands you ran with their results and the
               code-review findings with what you did about each.
               If code-review left findings you could not resolve, open it with `--draft` instead, list those findings
               at the top of the body, and run
               `gh issue edit ${{ env.ISSUE }} --remove-label ready-for-agent --add-label needs-info`.

            Hard rules:
            - Never merge a PR, never push to `main`, never touch Azure, never apply migrations.
            - This repository and its Actions logs are public: never print secrets, tokens, connection strings or user
              financial data.

      # The prompt has the agent run this check before it opens the PR; this repeats it on what was pushed. A PR that
      # would fail the release check becomes a draft, so Agent Auto-Merge leaves it to a human.
      - name: Check the PR's version and CHANGELOG
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          pr=$(gh pr list --state open --head "$BRANCH" --json number,isDraft --jq '.[] | select(.isDraft | not) | .number')
          if [ -z "$pr" ]; then
            echo "::notice::No ready PR for $BRANCH to check."
            exit 0
          fi
          git fetch -q origin "$BRANCH" && git checkout -q --detach "origin/$BRANCH"
          if out=$(bash .github/scripts/agent-version-check.sh --built-on-main "$BRANCH" 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"
          gh pr ready "$pr" --undo || true
          problems=$(sed -n 's/^::error:://p' <<< "$out" | sed 's/^/- /')
          gh pr comment "$pr" --body "$(printf '🤖 This PR would fail the release check, so it is now a draft:\n\n%s\n\nFix AppVersion.cs / CHANGELOG.md and mark it ready for review.' "$problems")" || true

      - name: Release the claim
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh issue edit "$ISSUE" --remove-label "agent:in-progress" || true

          pr=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          still_ready=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | index("ready-for-agent") != null')

          # Hand the ticket to a human when the run failed, or when it ended with no PR and without relabelling the
          # issue itself (needs-info / ready-for-human). No automatic retry.
          if [ "$JOB_STATUS" != "success" ] || { [ -z "$pr" ] && [ "$still_ready" = "true" ]; }; then
            gh issue edit "$ISSUE" --remove-label ready-for-agent --add-label ready-for-human || true
            gh issue comment "$ISSUE" --body "🤖 The scheduled Claude agent did not finish this ($JOB_STATUS, no PR). Moved to ready-for-human. Run: $RUN_URL" || true
          elif [ -n "$pr" ]; then
            echo "::notice::Opened PR #$pr for #$ISSUE"
          fi

  rebase:
    name: Rebase a stale agent PR
    needs: pick
    if: needs.pick.outputs.rebase_pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.pick.outputs.minutes) }}
    env:
      PR: ${{ needs.pick.outputs.rebase_pr }}
      BRANCH: ${{ needs.pick.outputs.branch }}
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.branch }}
          fetch-depth: 0

      - name: Setup .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # The check below judges the rebase against main as it is now. Another agent PR can merge while Claude works;
      # the next run rebases onto that, so it must not count as a failed rebase (#536 was labelled that way).
      - name: Record main before the rebase
        run: |
          git fetch -q origin main
          echo "START_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Chained runs are dispatched by the chain job, so their actor is github-actions[bot].
          allowed_bots: github-actions
          additional_permissions: |
            actions: read
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Edit,Write,Glob,Grep,TodoWrite,Bash(bash .github/scripts/agent-version-check.sh:*),Bash(bash .github/scripts/e2e-inmemory.sh:*),Bash(dotnet:*),Bash(npm:*),Bash(git:*),Bash(gh:*),Bash(jq:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*)"
          prompt: |
            You are the unattended scheduled ticket agent for ${{ github.repository }}. No human is watching this run.
            Your only job: rebase PR #${{ env.PR }} (branch `${{ env.BRANCH }}`, already checked out) onto `origin/main`,
            which has moved on since the PR was opened, so the PR now conflicts. Do not add features or refactor.

            1. Read AGENTS.md, "Parallel worktrees" and the Done checklist, then `gh pr view ${{ env.PR }} --comments`
               and the issue it closes.
            2. `git fetch origin main`, then `git rebase origin/main`. Resolve each conflict by keeping both sides' intent:
               - AppVersion.cs: re-bump to the next free version above `main` and every other open PR from an
                 `agent/issue-*` branch (read their AppVersion.cs), with the same bump level the PR had (patch, minor or
                 major). Update Current, Major, Minor and Patch together.
               - CHANGELOG.md: keep main's sections intact and move this PR's section to the top, renamed to the new
                 version and dated today.
               - Code: keep main's changes and re-apply this PR's change on top. If a conflict needs a product or design
                 decision, do not guess: `git rebase --abort`, explain it in a PR comment, and stop.
            3. Run `dotnet test PersonalFinance.sln` and "npm run lint", and fix only what the rebase broke. When the
               rebase touched `e2e-tests/` or PersonalFinance.Web (views, JavaScript, CSS), also run
               `bash .github/scripts/e2e-inmemory.sh`: it starts both apps on the InMemory provider (no database
               needed) and runs the E2E suites as CI does. Then run
               `bash .github/scripts/agent-version-check.sh ${{ env.BRANCH }}` and fix what it lists until it prints OK.
            4. `git push --force-with-lease origin ${{ env.BRANCH }}`. Then comment on the PR with the new version and
               anything you had to resolve by hand.

            Hard rules: never merge, never push to `main`, never touch Azure, never apply migrations. This repository
            and its Actions logs are public: never print secrets, tokens, connection strings or user financial data.

      - name: Check the rebase landed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          git fetch -q origin main "$BRANCH"
          if [ "$JOB_STATUS" = "success" ] && [ -n "${START_MAIN:-}" ] \
            && git merge-base --is-ancestor "$START_MAIN" "origin/$BRANCH"; then
            if git merge-base --is-ancestor origin/main "origin/$BRANCH"; then
              echo "::notice::PR #$PR is rebased onto main."
            else
              echo "::notice::PR #$PR is rebased onto main as of ${START_MAIN:0:8}; main has moved since, so a later run rebases it again."
            fi
            exit 0
          fi
          # Not retried every 30 minutes: the label keeps the picker off this PR until a human removes it.
          gh pr edit "$PR" --add-label "agent:rebase-failed" || true
          gh pr comment "$PR" --body "🤖 The scheduled Claude agent could not rebase this PR onto main ($JOB_STATUS). It needs a human; remove the agent:rebase-failed label to let the agent try again. Run: $RUN_URL" || true
          exit 1

  # GitHub drops or delays many cron ticks, so a run that did work starts the next one itself. The next run's pick
  # job decides whether there is eligible work; when it finds none, or the cap is full, the chain stops and the
  # cron starts it again later. A failed run never chains, so a broken token cannot sweep the whole queue to
  # ready-for-human. A run for one requested issue does not chain either.
  chain:
    name: Start the next run
    needs: [pick, implement, rebase]
    if: >-
      always() && !inputs.issue && needs.pick.result == 'success'
      && (needs.implement.result == 'success' || needs.rebase.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the next run if the working window has time left
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          now=$(( 10#$(TZ=America/Los_Angeles date +%H) * 60 + 10#$(TZ=America/Los_Angeles date +%M) ))
          quiet=$(( 10#${QUIET_FROM%%:*} * 60 + 10#${QUIET_FROM##*:} ))
          if [ $(( quiet - now )) -lt "$MIN_MINUTES_TO_START" ]; then
            echo "::notice::Quiet window is near (Pacific $(TZ=America/Los_Angeles date +%H:%M)): not chaining."
            exit 0
          fi
          # The new run waits in the concurrency group until this one ends.
          gh workflow run claude-ticket-agent.yml --ref "$DEFAULT_BRANCH" -f chained=true
          echo "::notice::Dispatched the next ticket agent run."
